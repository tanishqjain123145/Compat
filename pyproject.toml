[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "compat-runtime"
version = "0.1.0"
description = "Run Python functions in isolated virtualenvs configured by separate requirements files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tanishq Jain" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
]
keywords = ["compatibility", "virtualenv", "venv", "dependency isolation", "testing", "runtime"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
release = ["build", "twine"]

[project.scripts]
compat = "compat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compat*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
